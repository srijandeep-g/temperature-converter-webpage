<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempChnage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="fahrenheit.png">
</head>
<body>
    <div>
        <h2>Temperature Converter</h2>
    </div>
    <div class="container">
        <form>
            <label>Value in Celsius:</label>
            <input type="number" id="valC">
            <label>Value in Fahrenheit:</label>
            <input type="number" id="valF">
            <label>Value in Kelvin:</label>
            <input type="number" id="valK">
            <button id="convert">Convert</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
